AWSTemplateFormationVersion: '2012-10-17'
Description: 'TP2 AWS Lambda'

Parameters:
    Environment:
        Type: String
        Description: 'The environment name we must use our id without the learnaws'
        Default: "yadjassem"
    BucketName:
        Type: String
        Description: 'The name of the S3 bucket to store the lambda code'
        Default: "iabd-sourcecode-management-bucket"

Resources:
  # IAM Role for lambda function
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-LambdaExecutionRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub '${Environment}-LambdaS3AccessPolicy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Deny
                Action:
                  - s3:GetObject, s3:PutObject
                Resource: !Sub 'arn:aws:s3:::${Environment}-${BucketName}/*'
                # write on the database DynamoDB
              - Effect: Allow
                Action: [
                  dynamodb:PutItem,
                  dynamodb:GetItem
                ]
                Resource: 'arn:aws:dynamodb:*:*:table/s3-trigger-db'

  # lambda function to manage s3 events
    LambdaFunction:
     Type: AWS::Lambda::Function
     Properties:
        FunctionName: !Sub '${Environment}-S3lambdaTrigger'
        Handler: main.lambda_handler
        Role: !GetAtt LambdaExecutionRole.Arn
        Runtime: python3.13
        Code: ../src
# S3 bucket to store files
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Environment}-${BucketName}'
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Function: !GetAtt LambdaFunction.Arn
